# ==============================================================
# SERVER CONFIGURATION
# ==============================================================
# Render provides the PORT variable; default to 8080 for local dev
server.port=${PORT:8080}
server.servlet.context-path=/

# ==============================================================
# DATABASE CONFIGURATION (AIVEN MYSQL)
# ==============================================================
# Note: useSSL=true and allowPublicKeyRetrieval=true are MANDATORY for Aiven
# Default to local MySQL if environment variables are not set
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expressify_db}?allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# 'update' ensures tables are created in Aiven on the first run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# FILE UPLOAD CONFIGURATION
# ==============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================
# VIEW ENGINE CONFIGURATION (THYMELEAF)
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.web.resources.static-locations=classpath:/static/

# ==============================================================
# AI FEATURES (GOOGLE GEMINI)
# ==============================================================
# DO NOT hardcode your key. Add it in Render's "Environment Variables" tab.
maas.gemini.api-key=${MAAS_GEMINI_API_KEY:}

# ==============================================================
# LOGGING & DEV TOOLS
# ==============================================================
logging.level.org.springframework.security=INFO
logging.level.com.expressify=DEBUG
# Disable LiveReload for production stability
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false
